# Render Blueprint for the MedCare AI backend (FastAPI in backend/).
# In the Render dashboard: New > Blueprint > this repository. Render asks for the two
# secrets marked `sync: false`; nothing secret is stored in this file.
services:
  - type: web
    name: medcare-backend
    runtime: docker
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # GET / is cheap; /health calls Gemini on every request.
    healthCheckPath: /
    # Only changes to the backend redeploy it.
    buildFilter:
      paths:
        - backend/**
    envVars:
      # The Dockerfile starts uvicorn on port 8000.
      - key: PORT
        value: "8000"
      # Neon Postgres connection string (postgresql://...?sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Signs login tokens. Generated by Render, so it never appears in the repo.
      - key: SECRET_KEY
        generateValue: true
